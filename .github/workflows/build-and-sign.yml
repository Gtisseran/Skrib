name: Build, Sign (SignPath) and Release
on:
  push:
	tags:
	  - '*'

permissions:
  contents: write

jobs:
  build-sign:
	runs-on: windows-latest
	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Setup .NET
		uses: actions/setup-dotnet@v3
		with:
		  dotnet-version: '8.0.x'

	  - name: Restore
		run: dotnet restore Skrib.slnx

	  - name: Build (Release)
		run: dotnet build Skrib.slnx -c Release --no-restore

	  - name: Publish app (example)
		shell: pwsh
		run: |
		  # Adjust this publish to produce your MSIX / MSIXBUNDLE or installer
		  dotnet publish .\Skrib\Skrib.csproj -c Release -r win10-x64 --self-contained false

	  - name: Find package artifact
		id: findpkg
		shell: pwsh
		run: |
		  $p = Get-ChildItem -Path . -Recurse -Include *.msix,*.msixbundle,*.appinstaller,*.zip,*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
		  if (-not $p) { Write-Error 'No package found. Adapt publish step to produce .msix or .msixbundle.'; exit 1 }
		  echo "PACKAGE_PATH=$($p.FullName)" >> $env:GITHUB_ENV
		  Write-Host "Found package: $($p.FullName)"

	  - name: Upload to SignPath (request signature)
		env:
		  SIGNPATH_API_KEY: ${{ secrets.SIGNPATH_API_KEY }}
		  SIGNPATH_API_URL: ${{ secrets.SIGNPATH_API_URL }}
		shell: pwsh
		run: |
		  if (-not $env:SIGNPATH_API_KEY) { Write-Error 'SIGNPATH_API_KEY secret is required'; exit 1 }
		  $url = $env:SIGNPATH_API_URL
		  if (-not $url) { $url = 'https://api.signpath.io/v1' }
		  $package = $env:PACKAGE_PATH
		  Write-Host "Uploading $package to SignPath at $url..."

		  # NOTE: This is an example; adapt the endpoint and fields to your SignPath account/docs.
		  $respFile = 'signpath_response.json'
		  curl -s -X POST "$url/sign" -H "Authorization: Bearer $env:SIGNPATH_API_KEY" -F "file=@$package" -o $respFile
		  Write-Host "SignPath response saved to $respFile"
		  Get-Content $respFile

	  - name: Download signed artifact (placeholder)
		shell: pwsh
		run: |
		  # Inspect the SignPath response and download the signed artifact accordingly.
		  Write-Host 'Download step must be implemented according to SignPath response format.'

	  - name: Create GitHub Release
		id: create_release
		uses: actions/create-release@v1
		with:
		  tag_name: ${{ github.ref_name }}
		  release_name: Release ${{ github.ref_name }}
		  draft: false
		  prerelease: false

	  - name: Upload signed asset
		uses: actions/upload-release-asset@v1
		with:
		  upload_url: ${{ steps.create_release.outputs.upload_url }}
		  asset_path: ./signed-package.ext   # <-- update with actual signed file path
		  asset_name: Skrib-${{ github.ref_name }}-signed.msix
		  asset_content_type: application/octet-stream
