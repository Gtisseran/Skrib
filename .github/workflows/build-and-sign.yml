name: Build and Sign

on:
  push:
	branches: [ main ]
	tags:
	  - '*'
  pull_request:
	branches: [ main ]

jobs:
  build:
	runs-on: windows-latest

	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Setup .NET
		uses: actions/setup-dotnet@v4
		with:
		  dotnet-version: '8.0.x'

	  - name: Restore dependencies
		run: dotnet restore Skrib.slnx

	  - name: Build
		run: dotnet build Skrib.slnx -c Release --no-restore
